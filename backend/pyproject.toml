[project]
name = "portal-matricula-bff"
version = "0.1.0"
description = "BFF do Portal de Matrícula do Candidato Clariens (integração Lyceum Techne v2)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "anthropic>=1.17,<2",
  "pillow>=11",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
extend-select = ["B", "I", "UP", "RUF"]
# B008: Depends()/File() em defaults é o padrão do FastAPI; RUF012: defaults de lista são copiados pelo Pydantic
ignore = ["B008", "RUF012", "RUF001"]
